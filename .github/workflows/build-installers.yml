name: Build Desktop Installers & Executables

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Installer (.app & .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build macOS .app and Installer
        run: python installers/build_app.py
      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: IOC-Workbench-macOS-Installer
          path: |
            dist/IOC-Workbench-macOS-Installer.zip
            dist/IOC-Workbench-macOS-Installer.dmg

  build-linux:
    name: Linux App & Installer (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system Tkinter and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build Linux Executable and Installer
        run: python installers/build_app.py
      - name: Upload Linux Installer Package
        uses: actions/upload-artifact@v4
        with:
          name: IOC-Workbench-Linux-Installer
          path: |
            dist/IOC-Workbench-Linux
            dist/IOC-Workbench-Linux-Installer.tar.gz

  build-windows:
    name: Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build Windows Standalone .exe
        run: python installers/build_app.py
      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: IOC-Workbench-Windows-Executable
          path: dist/IOC-Workbench.exe
